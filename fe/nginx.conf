# Serve React app to users and forward API requests to backend.

# Define a virtual server.
server {
    listen 80;
    server_name _;     # Wildcard that accepts requests from any domain.

    root /usr/share/nginx/html;

    # Serve index.html by default when someone visits the page.
    index index.html;

    # Handle React Router by serving index.html for all routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to backend server.
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}